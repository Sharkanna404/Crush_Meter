<style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red: #FF3B30;
            --red-dark: #E62E24;
            --yellow: #FFCC00;
            --yellow-light: #FFE066;
            --black: #1a1a1a;
            --white: #ffffff;
            --cream: #FFF8E7;
            --text: #1a1a1a;
            --text-light: #555555;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--yellow);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .ticker {
            background: var(--black);
            color: var(--yellow);
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }
        .ticker-inner {
            display: inline-block;
            animation: ticker 20s linear infinite;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .top-bar {
            height: 12px;
            background: var(--red);
            border-bottom: 4px solid var(--black);
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        header {
            text-align: center;
            padding: 48px 20px 32px;
            position: relative;
        }
        header h1 {
            font-family: 'Rubik Mono One', 'Noto Sans SC', sans-serif;
            font-size: 2.8rem;
            color: var(--black);
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.2;
        }
        header h1 span {
            color: var(--red);
        }
        header p {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0 var(--black);
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0 var(--black);
        }
        .card.pink-card {
            background: var(--cream);
        }

        .cards-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }
        .card-half {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
            height: 520px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 640px) {
            .cards-row { flex-direction: column; gap: 16px; }
            .card-half { margin-bottom: 0; }
            header h1 { font-size: 2rem; }
        }

        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--black);
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .clear-btn {
            padding: 6px 16px;
            border: 3px solid var(--black);
            border-radius: 50px;
            background: var(--red);
            color: var(--white);
            font-size: 0.8rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 var(--black);
        }
        .clear-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--black);
        }
        .clear-btn:active {
            transform: translate(0, 0);
            box-shadow: 3px 3px 0 var(--black);
        }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 4px solid var(--black);
            border-radius: 50px;
            background: var(--white);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: all 0.15s;
            font-family: inherit;
            font-weight: 500;
        }
        .input-group input:focus,
        .input-group textarea:focus {
            background: var(--yellow-light);
            box-shadow: 4px 4px 0 var(--black);
        }
        .input-group textarea {
            min-height: 200px;
            resize: vertical;
            line-height: 1.7;
            border-radius: 20px;
        }

        .btn {
            width: 100%;
            padding: 18px 32px;
            border: 4px solid var(--black);
            border-radius: 50px;
            background: var(--yellow);
            color: var(--black);
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 6px 6px 0 var(--black);
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 var(--black);
            background: var(--yellow-light);
        }
        .btn:hover .btn-icon {
            animation: heartPulse 0.6s ease-in-out;
        }
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }
        .btn:active {
            transform: translate(0, 0);
            box-shadow: 6px 6px 0 var(--black);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .pink-section {
            background: var(--red);
            margin: 0;
            padding: 32px 0;
            position: relative;
            border-top: 4px solid var(--black);
            border-bottom: 4px solid var(--black);
        }

        .result { display: none; }
        .result.show { display: block; }
        .result.show > * {
            animation: fadeInUp 0.6s ease-out both;
        }
        .result.show > *:nth-child(1) { animation-delay: 0s; }
        .result.show > *:nth-child(2) { animation-delay: 0.1s; }
        .result.show > *:nth-child(3) { animation-delay: 0.2s; }
        .result.show > *:nth-child(4) { animation-delay: 0.3s; }
        .result.show > *:nth-child(5) { animation-delay: 0.4s; }
        .result.show > *:nth-child(6) { animation-delay: 0.5s; }
        .result.show > *:nth-child(7) { animation-delay: 0.6s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .heart-score {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px;
            background: var(--yellow);
            border-radius: 24px;
            border: 4px solid var(--black);
            box-shadow: 6px 6px 0 var(--black);
        }
        .heart-score .number {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 5rem;
            font-weight: 400;
            color: var(--black);
            line-height: 1;
        }
        .heart-score .level {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 50px;
            background: var(--red);
            color: var(--white);
            font-weight: 900;
            margin-top: 12px;
            font-size: 1.1rem;
            border: 3px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dimensions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .dim-item {
            background: var(--white);
            border-radius: 20px;
            padding: 18px 14px;
            text-align: center;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .dim-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }
        .dim-item .dim-name {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dim-item .dim-score {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--black);
        }
        .dim-item .dim-bar {
            height: 10px;
            background: var(--cream);
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            border: 2px solid var(--black);
        }
        .dim-item .dim-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--yellow);
            transition: width 1s ease-out;
        }

        .dimensions-radar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            background: var(--white);
            border-radius: 24px;
            padding: 20px;
            border: 4px solid var(--black);
            box-shadow: 6px 6px 0 var(--black);
        }
        .radar-chart-wrap {
            width: 320px;
            height: 320px;
            position: relative;
            margin-bottom: 16px;
        }
        .radar-details {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .radar-details .dim-item {
            flex: 1;
            min-width: 100px;
            max-width: 140px;
            background: var(--white);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            border: 3px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            user-select: none;
        }
        .radar-details .dim-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--black);
        }
        .radar-details .dim-item.active {
            background: var(--yellow);
            box-shadow: 4px 4px 0 var(--black);
        }
        .radar-details .dim-item .dim-name {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .radar-details .dim-item .dim-score {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--black);
            line-height: 1.2;
        }
        .radar-details .dim-item .dim-bar {
            height: 8px;
            background: var(--cream);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            border: 2px solid var(--black);
        }
        .radar-details .dim-item .dim-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: var(--yellow);
            transition: width 1s ease-out;
        }
        .dim-detail-panel {
            width: 100%;
            margin-top: 16px;
            padding: 20px 24px;
            background: var(--yellow-light);
            border-radius: 16px;
            border: 3px dashed var(--black);
            color: var(--text);
            line-height: 1.8;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            display: none;
        }
        .dim-detail-panel.show { display: block; }
        .dim-detail-panel .detail-label {
            font-weight: 900;
            color: var(--red);
            margin-bottom: 8px;
            font-size: 1rem;
            text-transform: uppercase;
        }
        @media (max-width: 640px) {
            .radar-chart-wrap { width: 260px; height: 260px; }
            .radar-details { gap: 8px; }
            .radar-details .dim-item { min-width: 80px; padding: 10px 8px; }
            .radar-details .dim-item .dim-score { font-size: 1.3rem; }
        }
        @media (max-width: 400px) {
            .radar-chart-wrap { width: 220px; height: 220px; }
            .radar-details .dim-item { min-width: 70px; max-width: none; }
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--black);
            margin-bottom: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .signals { margin-bottom: 24px; }
        .signal-item {
            background: var(--white);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 6px solid var(--red);
            line-height: 1.7;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
            font-weight: 500;
        }
        .advice-box {
            background: var(--yellow);
            border-radius: 20px;
            padding: 24px;
            line-height: 1.8;
            color: var(--black);
            font-weight: 700;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--black);
            box-shadow: 6px 6px 0 var(--black);
        }
        .risk-box {
            background: var(--cream);
            border-radius: 16px;
            padding: 18px 22px;
            margin-top: 16px;
            border: 3px dashed var(--red);
            color: var(--red);
            font-weight: 700;
        }

        .history-list {
            display: grid;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 8px;
        }
        .history-list::-webkit-scrollbar { width: 8px; }
        .history-list::-webkit-scrollbar-track { background: var(--cream); border-radius: 10px; border: 2px solid var(--black); }
        .history-list::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; border: 2px solid var(--black); }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.15s;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
        }
        .history-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
            background: var(--yellow-light);
        }
        .history-item .h-name {
            font-weight: 900;
            color: var(--black);
        }
        .history-item .h-score {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--red);
        }
        .history-item .h-date {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 40px;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--black);
            font-weight: 900;
            text-transform: uppercase;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 4px solid var(--black);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            background: var(--cream);
            border: 4px solid var(--red);
            border-radius: 16px;
            padding: 16px 20px;
            color: var(--red);
            margin-top: 16px;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .trend-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 3px dashed var(--black);
        }
        .trend-section .section-title {
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .trend-chart-container {
            position: relative;
            height: 280px;
            background: var(--white);
            border-radius: 20px;
            padding: 0;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
        }
        .trend-empty {
            text-align: center;
            padding: 24px;
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 700;
        }
        .trend-empty .emoji {
            font-size: 1.5rem;
            margin-bottom: 4px;
            display: block;
        }

        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 20px;
            gap: 12px;
            background: var(--yellow);
            border-bottom: 4px solid var(--black);
        }
        .user-bar .user-name {
            font-weight: 900;
            color: var(--black);
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .user-bar .user-btn {
            padding: 8px 18px;
            border-radius: 50px;
            border: 3px solid var(--black);
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 var(--black);
        }
        .user-bar .btn-login {
            background: var(--red);
            color: var(--white);
        }
        .user-bar .btn-login:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--black);
        }
        .user-bar .btn-logout {
            background: var(--white);
            color: var(--black);
        }
        .user-bar .btn-logout:hover {
            background: var(--red);
            color: var(--white);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--black);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s;
        }
        .modal {
            background: var(--yellow);
            border-radius: 28px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            position: relative;
            border: 4px solid var(--black);
            box-shadow: 10px 10px 0 var(--black);
        }
        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .modal-header h3 {
            color: var(--black);
            font-size: 1.4rem;
            margin-bottom: 4px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .modal-header p {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 700;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--black);
            font-weight: 900;
        }
        .modal-close:hover { color: var(--red); }
        .modal-input {
            width: 100%;
            padding: 14px 16px;
            border: 4px solid var(--black);
            border-radius: 16px;
            background: var(--white);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.15s;
            font-weight: 500;
        }
        .modal-input:focus {
            background: var(--yellow-light);
            box-shadow: 4px 4px 0 var(--black);
        }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border: 4px solid var(--black);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0 var(--black);
        }
        .modal-btn-primary {
            background: var(--red);
            color: var(--white);
        }
        .modal-btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }
        .modal-btn-secondary {
            background: var(--white);
            color: var(--black);
        }
        .modal-btn-secondary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }
        .modal-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 700;
        }
        .modal-footer a {
            color: var(--red);
            cursor: pointer;
            font-weight: 900;
        }
        .modal-footer a:hover {
            text-decoration: underline;
        }

        .register-hint {
            background: var(--yellow-light);
            border: 3px dashed var(--black);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .register-hint p {
            color: var(--black);
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .register-hint .hint-btn {
            padding: 10px 28px;
            border: 3px solid var(--black);
            border-radius: 50px;
            background: var(--red);
            color: var(--white);
            font-weight: 900;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 4px 4px 0 var(--black);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .register-hint .hint-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .upload-area {
            border: 3px dashed var(--black);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            background: var(--cream);
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 16px;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--red);
            background: var(--yellow-light);
            box-shadow: 4px 4px 0 var(--black);
        }
        .upload-area .upload-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }
        .upload-area .upload-text {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 700;
        }
        .upload-area .upload-hint {
            color: var(--red);
            font-size: 0.8rem;
            margin-top: 8px;
            font-weight: 700;
        }
        .upload-count {
            text-align: center;
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .upload-count .count-num {
